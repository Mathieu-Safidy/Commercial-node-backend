name: Deploy Docker Compose to DigitalOcean

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurer SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      # 3️⃣ Déployer via SSH
      - name: Deploy on Droplet
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} '
            cd "${{ secrets.APP_DIR }}" || { echo "Erreur cd"; exit 1; }

            git pull origin deploiment || true   # ou ta branche

            docker compose down || true

            # Crée un fichier .env temporaire avec tes secrets
            cat > .env.deploy << EOF
            JWT_SECRETS=${{ secrets.JWT_SECRETS }}
            JWT_REFRESH_SECRETS=${{ secrets.JWT_REFRESH_SECRETS }}
            # Ajoute d'autres si besoin
            EOF

            # Lance avec --env-file
            docker compose up -d --build --force-recreate \
              --env-file .env.deploy \
              2>&1 | tee docker-up.log

            # Nettoie immédiatement
            rm -f .env.deploy

            echo "→ Logs du déploiement :"
            cat docker-up.log

            echo "→ Vérif dans le container"
            docker compose exec api env | grep -E "JWT_SECRETS|JWT_REFRESH_SECRETS" || echo "Variables non visibles ? Vérifie docker-compose.yml"
            docker ps -a
          '