name: Deploy Docker Compose to DigitalOcean

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurer SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      # 3️⃣ Déployer via SSH
      - name: Deploy on Droplet
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} << 'ENDSSH'
            set -x   # debug : montre chaque commande

            APP_DIR="${{ secrets.APP_DIR }}"

            if ! cd "$APP_DIR"; then
              echo "ERREUR : impossible de cd dans $APP_DIR"
              exit 1
            fi

            pwd
            git status

            echo "→ Arrêt des containers (si existants)"
            docker compose down || true

            echo "→ Création .env.deploy (protégé)"
            cat > .env.deploy << 'ENDENV'
JWT_SECRETS=${{ secrets.JWT_SECRETS }}
JWT_REFRESH_SECRETS=${{ secrets.JWT_REFRESH_SECRETS }}
ENDENV

            echo "→ Contenu masqué de .env.deploy :"
            cat .env.deploy | sed 's/./*/g' || echo "Fichier vide ?"

            echo "→ Lancement du déploiement"
            docker compose up -d --build --force-recreate \
              --env-file .env.deploy \
              2>&1 | tee docker-up.log

            rm -f .env.deploy .docker-up.log  # nettoyage

            echo "→ Logs du up :"
            cat docker-up.log || echo "Aucun log"

            echo "→ Vérification des variables dans le container"
            # Remplace 'api' par le vrai nom de ton service (regarde docker compose ps)
            docker compose exec api env | grep -i jwt || echo "Aucune variable JWT trouvée → vérifie le service name ou docker-compose.yml"

            echo "→ État des containers"
            docker ps -a --format "table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Ports}}"
          ENDSSH