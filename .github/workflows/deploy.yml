name: Deploy Docker Compose to DigitalOcean

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurer SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      # 3️⃣ Déployer via SSH
      - name: Deploy on Droplet
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} "
          # Si le dossier n'existe pas, cloner le repo
          if [ ! -d '${{ secrets.APP_DIR }}/.git' ]; then
            git clone ${{ secrets.REPO_URL }} ${{ secrets.APP_DIR }};
          else
            cd ${{ secrets.APP_DIR }};
            git pull origin master;
          fi

          # Aller dans le dossier
          cd ${{ secrets.APP_DIR }};

          # Relancer les containers Docker Compose
          docker-compose down;
          docker-compose up -d --build;
          "