name: Deploy Docker Compose to DigitalOcean

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurer SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      # 3️⃣ Déployer via SSH
      - name: Deploy on Droplet
        run: |
          ssh -o StrictHostKeyChecking=no $$   {{ secrets.DO_USER }}@   $${{ secrets.DO_HOST }} '
            set -x   # ← affiche chaque commande exécutée

            APP_DIR="${{ secrets.APP_DIR }}"

            cd "$APP_DIR" || { echo "ERREUR : impossible d'aller dans $APP_DIR"; exit 1; }
            pwd
            git status

            echo "→ Arrêt des containers..."
            docker compose down --verbose || echo "docker compose down a retourné $? (code erreur)"

            echo "→ Variables d'environnement :"
            echo "JWT_SECRETS=${JWT_SECRETS:-(non défini)}"
            echo "JWT_REFRESH_SECRETS=${JWT_REFRESH_SECRETS:-(non défini)}"

            echo "→ Lancement du build & up..."
            JWT_SECRETS="${{ secrets.JWT_SECRETS }}" \
            JWT_REFRESH_SECRETS="${{ secrets.JWT_REFRESH_SECRETS }}" \
              docker compose up -d --build --force-recreate 2>&1 | tee build.log

            echo "→ Contenu de build.log :"
            cat build.log || echo "Pas de log disponible"

            echo "→ docker ps :"
            docker ps -a
          '