name: Deploy Docker Compose to DigitalOcean

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurer SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      # 3️⃣ Déployer via SSH
      - name: Deploy on Droplet
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} << 'ENDSSH'
            set -x

            APP_DIR="${{ secrets.APP_DIR }}"

            if ! cd "$APP_DIR"; then
              echo "ERREUR : impossible de cd dans $APP_DIR"
              exit 1
            fi

            pwd
            git status

            echo "→ Arrêt des containers (si existants)"
            docker compose down || true

            echo "→ Création .env.deploy sans heredoc"
            echo "JWT_SECRETS=${{ secrets.JWT_SECRETS }}" > .env.deploy
            echo "JWT_REFRESH_SECRETS=${{ secrets.JWT_REFRESH_SECRETS }}" >> .env.deploy

            echo "→ Contenu masqué du fichier env :"
            cat .env.deploy | sed 's/./*/g' || echo "(fichier vide ou erreur)"

            echo "→ Lancement du déploiement"
            docker compose up -d --build --force-recreate --env-file .env.deploy \
              2>&1 | tee docker-up.log

            rm -f .env.deploy docker-up.log

            echo "→ Logs du déploiement :"
            cat docker-up.log || echo "Pas de logs disponibles"

            echo "→ Vérification des variables dans le container"
            # Change 'api' par le vrai nom de service (ex: backend, commercial-api, node-app...)
            # Trouve-le avec : docker compose ps
            docker compose exec api env | grep -i jwt || echo "Variables JWT non trouvées (vérifie nom service + docker-compose.yml)"

            echo "→ État final des containers"
            docker ps -a --format "table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Ports}}"
          ENDSSH